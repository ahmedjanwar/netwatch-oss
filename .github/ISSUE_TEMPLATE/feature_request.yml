name: Feature idea
description: Something Netwatch could do better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What were you trying to do?
      description: Describe the situation and what got in the way, rather than a specific solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
